name: AWS Docker deployment

on:
  push:
    branches:
      - "develop"
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=tag
            type=sha,enable=true,priority=100,format=short
          images: ${{ steps.login-ecr.outputs.registry }}/helix

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%dT%H-%M')" >> $GITHUB_OUTPUT

      - name: Add CodeArtifact variables
        id: codeartifact
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain clearlyenergy --domain-owner 870817328084 --query authorizationToken --output text --region us-east-2)
          echo PIP_EXTRA_INDEX_URL="https://aws:$CODEARTIFACT_AUTH_TOKEN@clearlyenergy-870817328084.d.codeartifact.us-east-2.amazonaws.com/pypi/ClearlyEnergy/simple/" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        env:
          PIP_EXTRA_INDEX_URL: ${{ steps.codeartifact.outputs.PIP_EXTRA_INDEX_URL }}
        with:
          context: .
          push: true
          tags: >
            ${{ steps.meta.outputs.tags }},
            ${{ steps.login-ecr.outputs.registry }}/helix:${{ steps.date.outputs.date }},
            ${{ steps.login-ecr.outputs.registry }}/helix:latest
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/helix:latest
          # cache-to: type=inline
          secret-envs: |
            PIP_EXTRA_INDEX_URL=PIP_EXTRA_INDEX_URL

      - name: Trigger Kubernetes Deploy
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Deploy Kubernete staging image
          repo: ClearlyEnergy/helix-aws-config
          token: ${{ secrets.ANSIBLE_ACCESS_TOKEN }}
          ref: master
          inputs: '{ "image": "${{ steps.login-ecr.outputs.registry }}/helix:${{ steps.date.outputs.date }}", "role": "helix" }'
